services:
  stt:
    build: .
    env_file: .env
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - models:/models
      - registry:/data
    gpus: all
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:2025.5.0
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
volumes:
  models:
  registry:
