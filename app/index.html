<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CortexLab STT</title><style>body{font:16px system-ui;max-width:720px;margin:60px auto;padding:20px;background:#111827;color:#eee}input,button,textarea{font:inherit;padding:12px;margin:6px 0;border-radius:8px}textarea{width:95%;height:200px}button{cursor:pointer}</style><h1>CortexLab STT</h1><p>Transcrição local · teste de microfone ou arquivo</p><input id="key" type="password" placeholder="Chave da API"><br><input id="file" type="file" accept="audio/*"><button id="upload">Transcrever arquivo</button><br><button id="start">Gravar ao vivo</button><button id="stop" disabled>Finalizar</button><p id="status"></p><textarea id="out" placeholder="Transcrição"></textarea><script>
let ws,ctx,mic,node,source,t0;const $=id=>document.getElementById(id);function status(s){$('status').textContent=s} $('upload').onclick=async()=>{try{let f=new FormData();f.append('file',$('file').files[0]);let t=performance.now();let r=await fetch('/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+$('key').value},body:f});if(!r.ok)throw Error(await r.text());$('out').value=(await r.json()).text;status(Math.round(performance.now()-t)+' ms')}catch(e){status(e.message)}};
function cleanup(){if(node)node.disconnect();if(source)source.disconnect();if(mic)mic.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')ctx.close();$('start').disabled=false;$('stop').disabled=true}
$('start').onclick=async()=>{try{$('start').disabled=true;mic=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext({sampleRate:16000});if(ctx.sampleRate!==16000)throw Error('Taxa de áudio não suportada');ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/v1/audio/stream');ws.onopen=()=>ws.send(JSON.stringify({api_key:$('key').value,language:'pt'}));ws.onmessage=e=>{let r=JSON.parse(e.data);if(r.type==='ready'){source=ctx.createMediaStreamSource(mic);node=ctx.createScriptProcessor(4096,1,1);node.onaudioprocess=e=>{if(ws.readyState!==1)return;if(ws.bufferedAmount>256000){status('Conexão congestionada');ws.close();return}let x=e.inputBuffer.getChannelData(0),p=new Int16Array(x.length);for(let i=0;i<x.length;i++)p[i]=Math.max(-1,Math.min(1,x[i]))*32767;ws.send(p.buffer)};source.connect(node);node.connect(ctx.destination);$('stop').disabled=false;t0=performance.now();status('Gravando');}else{$('out').value=r.text;status(r.type+' · '+Math.round(performance.now()-t0)+' ms desde início')}};ws.onclose=()=>cleanup();ws.onerror=()=>{status('Erro de conexão');cleanup()}}catch(e){status(e.message);cleanup()}};$('stop').onclick=()=>{if(node)node.disconnect();if(mic)mic.getTracks().forEach(t=>t.stop());$('stop').disabled=true;if(ws?.readyState===1)ws.send('finish')};</script></html>
