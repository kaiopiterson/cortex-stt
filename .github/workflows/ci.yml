name: CI
on:
  push:
    branches: [develop, "fix/**", "feature/**"]
  pull_request:
    branches: [develop, main, 'feature/**']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock"
      - run: python -m pip check
      - run: python -m pytest
        env:
          STT_API_KEY: ci-only-test-key-not-for-production-0000
          STT_DEVICE: cpu
          STT_COMPUTE: int8
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app --python-version ${{ matrix.python }}

  docker-build:
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.72.0
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cortex-stt:ci .
      - run: docker run --rm --entrypoint python3 cortex-stt:ci -c 'import faster_whisper, av, ctranslate2, prometheus_client'
      - name: Report pinned base image digests
        run: |
          for image in $(grep -E '^FROM ' Dockerfile | awk '{print $2}'); do
            docker image inspect --format '{{.RepoTags}} {{index .RepoDigests 0}}' "$image"
          done
      # Trivy runs from its official image pinned by version (and digest once known),
      # never through the trivy-action/setup-trivy tags compromised in March 2026.
      - name: Scan image with Trivy (fail on fixable CRITICAL)
        run: |
          docker pull "$TRIVY_IMAGE"
          docker image inspect --format 'trivy {{index .RepoDigests 0}}' "$TRIVY_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress cortex-stt:ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1 uv==0.11.32
      - name: Locks match the declared dependencies
        run: |
          cp requirements.lock requirements-dev.lock /tmp/
          uv pip compile --universal --python-version 3.11 --generate-hashes --only-binary :all: --no-header -o /tmp/requirements.lock requirements.txt
          uv pip compile --universal --python-version 3.11 --generate-hashes --only-binary :all: --no-header -o /tmp/requirements-dev.lock requirements-dev.txt
          diff -u requirements.lock /tmp/requirements.lock
          diff -u requirements-dev.lock /tmp/requirements-dev.lock
      - run: pip-audit -r requirements.lock --require-hashes --progress-spinner off
