name: CI
on:
  push:
    branches: [develop, "fix/**", "feature/**"]
  pull_request:
    branches: [develop, main, 'feature/**']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest
        env:
          STT_API_KEY: ci-only-test-key-not-for-production-0000
          STT_DEVICE: cpu
          STT_COMPUTE: int8
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cortex-stt:ci .
      - run: docker run --rm --entrypoint python3 cortex-stt:ci -c 'import faster_whisper, av, ctranslate2'
